name: Source simulator startup probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Isolated simulator startup
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Probe startup without product compilation
        run: python3 scripts/path-c/source_simulator_probe.py
