name: C1 Engine

on:
  pull_request:
    branches: [native-reader]
  push:
    branches: [native-reader]
  workflow_dispatch:
    inputs:
      execution:
        description: Runner to use for this C1 validation
        type: choice
        default: local
        options: [local, cloud]
      cloud_cache:
        description: Cold skips restore; warm requires the same commit cache
        type: choice
        default: cold
        options: [cold, warm]

permissions:
  contents: read

concurrency:
  group: c1-engine-${{ inputs.execution || 'local' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Keep the required check independent of skipped or failed test jobs.
  regression:
    name: C1 engine regression
    if: ${{ always() }}
    needs: engine
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require successful engine and native product tests
        env:
          ENGINE_RESULT: ${{ needs.engine.result }}
        shell: bash
        run: |
          if [[ "$ENGINE_RESULT" != "success" ]]; then
            echo "::error::C1 tests did not succeed (result: $ENGINE_RESULT)."
            if [[ "$ENGINE_RESULT" == "skipped" ]]; then
              echo "::error::Fork PRs cannot use the self-hosted runner. A maintainer must review and transfer the changes to a repository-owned branch, then pass C1 on its PR before merging."
            fi
            exit 1
          fi
          echo "Engine and native product regressions passed."

  engine:
    name: C1 engine and native product tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.execution == 'cloud' && '["xcode-27"]' || '["self-hosted","macOS","ARM64","legado-macos-local"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: ${{ inputs.execution == 'cloud' && '/Applications/Xcode_27.0.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - name: Isolate build caches
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/legado/gradle" >> "$GITHUB_ENV"
          echo "KONAN_DATA_DIR=$RUNNER_TOOL_CACHE/legado/konan" >> "$GITHUB_ENV"
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            android_sdk="$(cd "$RUNNER_TEMP/../../android-sdk" && pwd)"
            echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preflight hosted ARM64 environment
        if: inputs.execution == 'cloud'
        env:
          C1_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/path-c/cloud_preflight.sh
      - name: Restore isolated cloud cache
        if: inputs.execution == 'cloud' && inputs.cloud_cache == 'warm'
        id: cloud-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
            ${{ env.KONAN_DATA_DIR }}
          key: c1-cloud-xcode27-arm64-v1-${{ github.sha }}
      - name: Record cloud cache state
        if: inputs.execution == 'cloud'
        env:
          CACHE_MODE: ${{ inputs.cloud_cache }}
          CACHE_HIT: ${{ steps.cloud-cache.outputs.cache-hit }}
        run: |
          printf 'mode=%s\nhit=%s\nkey=c1-cloud-xcode27-arm64-v1-%s\n' "$CACHE_MODE" "$CACHE_HIT" "$GITHUB_SHA" > ci-results/cache.txt
          if [[ "$CACHE_MODE" == warm && "$CACHE_HIT" != true ]]; then
            echo '::warning::Cache did not hit; this run is not a warm-cache validation.'
          fi
      - name: Preflight local fixtures
        run: |
          python3 -m unittest discover -s scripts/path-c -p 'test_*.py'
          python3 scripts/path-c/ci_harness.py --fixtures-only --output ci-results/preflight
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true # Cloud uses the explicit commit-isolated cache above.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Start hosted resource sampler
        if: inputs.execution == 'cloud'
        run: |
          # Aggregate process RSS is sampled, not an exact physical-memory peak.
          nohup python3 -u scripts/path-c/cloud_resources.py > ci-results/resources.jsonl 2> ci-results/resources-error.log < /dev/null &
          echo "$!" > "$RUNNER_TEMP/c1-resource-sampler.pid"
      - name: Check environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          java -version
          df -h .
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/commit.txt
      - name: Download XcodeGen locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.46.0 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --dir "$RUNNER_TEMP/c1-xcodegen"
          unzip -q "$RUNNER_TEMP/c1-xcodegen/xcodegen.zip" -d "$RUNNER_TEMP/c1-xcodegen"
          echo "$RUNNER_TEMP/c1-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Record hosted command versions
        if: inputs.execution == 'cloud'
        run: |
          python3 --version
          git --version
          gh --version
          java -version
          xcodegen --version
          ./gradlew --version
          sed -n '1,25p' gradle/libs.versions.toml
      - name: Build native libraries
        run: bash scripts/build-ios-native.sh ios_simulator_arm64 ios_arm64 2>&1 | tee ci-results/native-build.log
      - name: Build engine and compile original UI regression
        run: |
          ./gradlew --no-daemon --no-watch-fs --build-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :engine-ios:linkDebugFrameworkIosSimulatorArm64 \
            :engine-ios:linkDebugFrameworkIosArm64 \
            :ui:compileKotlinIosSimulatorArm64 2>&1 | tee ci-results/engine-build.log
      - name: Build Swift harness
        run: |
          xcodegen generate --spec engine-ios/harness/project.yml
          xcodebuild -project engine-ios/harness/PathCEngineHarness.xcodeproj \
            -scheme PathCEngineHarness -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath engine-ios/harness/build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci-results/harness-build.log
      - name: Run network, restart cache and fresh network regressions
        run: python3 scripts/path-c/ci_harness.py --output ci-results ${{ inputs.execution == 'cloud' && '--runtime-version 27.0' || '' }}
      - name: Run native Swift product regressions
        run: python3 scripts/path-c/native_product_ci.py --output ci-results/native-product ${{ inputs.execution == 'cloud' && '--runtime-version 27.0' || '' }}
      - name: Stop hosted resource sampler
        if: always() && inputs.execution == 'cloud'
        run: |
          if [[ -f "$RUNNER_TEMP/c1-resource-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/c1-resource-sampler.pid")" || true
          fi
      - name: Measure cloud cache and evidence sizes
        if: always() && inputs.execution == 'cloud'
        id: cloud-size
        run: |
          df -h . | tee ci-results/disk-final.txt
          du -sk ci-results "$GRADLE_USER_HOME" "$KONAN_DATA_DIR" | tee ci-results/sizes-kib.txt
          # Bound the new cache below 2 GiB uncompressed; no quota expansion.
          kib=$(du -sk "$GRADLE_USER_HOME/caches" "$GRADLE_USER_HOME/wrapper" "$KONAN_DATA_DIR" | awk '{s += $1} END {print s}')
          if (( kib < 2097152 )); then echo 'save=true' >> "$GITHUB_OUTPUT"; fi
      - name: Save bounded cloud cache
        if: success() && inputs.execution == 'cloud' && steps.cloud-cache.outputs.cache-hit != 'true' && steps.cloud-size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
            ${{ env.KONAN_DATA_DIR }}
          key: c1-cloud-xcode27-arm64-v1-${{ github.sha }}
      - name: Print hosted evidence to Actions logs
        if: always() && inputs.execution == 'cloud'
        run: python3 scripts/path-c/cloud_evidence.py
      - name: Upload validation evidence
        if: always() && inputs.execution != 'cloud'
        uses: actions/upload-artifact@v6
        with:
          name: c1-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/
            !ci-results/native-product/DerivedData/
          retention-days: 7
