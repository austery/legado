name: C1 Engine

on:
  pull_request:
    branches: [native-reader]
  push:
    branches: [native-reader]
  workflow_dispatch:
    inputs:
      execution:
        description: Runner to use for this C1 validation
        type: choice
        default: cloud
        options: [local, cloud]
      cloud_cache:
        description: auto restores compatible caches; cold skips restore; warm requires both hits
        type: choice
        default: auto
        options: [auto, cold, warm]

permissions:
  contents: read

concurrency:
  group: c1-engine-${{ inputs.execution || 'cloud' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Keep the required check independent of skipped or failed test jobs.
  regression:
    name: C1 engine regression
    if: ${{ always() }}
    needs: engine
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require successful engine and native product tests
        env:
          ENGINE_RESULT: ${{ needs.engine.result }}
        shell: bash
        run: |
          if [[ "$ENGINE_RESULT" != "success" ]]; then
            echo "::error::C1 tests did not succeed (result: $ENGINE_RESULT)."
            if [[ "$ENGINE_RESULT" == "skipped" ]]; then
              echo "::error::Fork PRs require a maintainer to review and transfer the changes to a repository-owned branch, then pass C1 on its PR before merging."
            fi
            exit 1
          fi
          echo "Engine and native product regressions passed."

  engine:
    name: C1 engine and native product tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.execution != 'local' && '["xcode-27"]' || '["self-hosted","macOS","ARM64","legado-macos-local"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: ${{ inputs.execution != 'local' && '/Applications/Xcode_27.0.app/Contents/Developer' || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - name: Isolate build caches
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/legado/gradle" >> "$GITHUB_ENV"
          echo "KONAN_DATA_DIR=$RUNNER_TOOL_CACHE/legado/konan" >> "$GITHUB_ENV"
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            android_sdk="$(cd "$RUNNER_TEMP/../../android-sdk" && pwd)"
            echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preflight hosted ARM64 environment
        if: inputs.execution != 'local'
        env:
          C1_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash scripts/path-c/cloud_preflight.sh
      - name: Define reusable toolchain cache keys
        if: inputs.execution != 'local'
        id: cache-keys
        env:
          FINGERPRINT: ${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle.properties') }}
        run: |
          test -n "$FINGERPRINT"
          echo "gradle=c1-cloud-gradle-arm64-xcode27-v2-$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "native=c1-cloud-native-arm64-xcode27-v2-$FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Restore Gradle dependencies and task cache
        if: inputs.execution != 'local' && inputs.cloud_cache != 'cold'
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ steps.cache-keys.outputs.gradle }}
      - name: Restore Kotlin Native toolchain
        if: inputs.execution != 'local' && inputs.cloud_cache != 'cold'
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KONAN_DATA_DIR }}
          key: ${{ steps.cache-keys.outputs.native }}
      - name: Record and validate cloud cache state
        if: inputs.execution != 'local'
        env:
          CACHE_MODE: ${{ inputs.cloud_cache || 'auto' }}
          GRADLE_HIT: ${{ steps.gradle-cache.outputs.cache-hit }}
          NATIVE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          GRADLE_KEY: ${{ steps.cache-keys.outputs.gradle }}
          NATIVE_KEY: ${{ steps.cache-keys.outputs.native }}
        run: |
          printf 'mode=%s\ngradle_hit=%s\nnative_hit=%s\ngradle_key=%s\nnative_key=%s\n' \
            "$CACHE_MODE" "$GRADLE_HIT" "$NATIVE_HIT" "$GRADLE_KEY" "$NATIVE_KEY" > ci-results/cache.txt
          if [[ "$CACHE_MODE" == warm && ( "$GRADLE_HIT" != true || "$NATIVE_HIT" != true ) ]]; then
            echo '::error::Warm validation requires exact hits for both cache layers.'
            exit 1
          fi
      - name: Preflight local fixtures
        run: |
          python3 -m unittest discover -s scripts/path-c -p 'test_*.py'
          python3 scripts/path-c/ci_harness.py --fixtures-only --output ci-results/preflight
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true # Explicit hosted cache layers; persistent local caches are untouched.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Start hosted resource sampler
        if: inputs.execution != 'local'
        run: |
          # Aggregate process RSS is sampled, not an exact physical-memory peak.
          nohup python3 -u scripts/path-c/cloud_resources.py > ci-results/resources.jsonl 2> ci-results/resources-error.log < /dev/null &
          echo "$!" > "$RUNNER_TEMP/c1-resource-sampler.pid"
      - name: Check environment
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          java -version
          df -h .
          mkdir -p ci-results
          git rev-parse HEAD > ci-results/commit.txt
      - name: Download XcodeGen locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.46.0 --repo yonaskolb/XcodeGen --pattern xcodegen.zip --dir "$RUNNER_TEMP/c1-xcodegen"
          unzip -q "$RUNNER_TEMP/c1-xcodegen/xcodegen.zip" -d "$RUNNER_TEMP/c1-xcodegen"
          echo "$RUNNER_TEMP/c1-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Record hosted command versions
        if: inputs.execution != 'local'
        run: |
          python3 --version
          git --version
          gh --version
          java -version
          xcodegen --version
          ./gradlew --version
          sed -n '1,25p' gradle/libs.versions.toml
      - name: Build native libraries
        run: bash scripts/build-ios-native.sh ios_simulator_arm64 ios_arm64 2>&1 | tee ci-results/native-build.log
      - name: Build engine and compile original UI regression
        run: |
          ./gradlew --no-daemon --no-watch-fs --build-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            :engine-ios:linkDebugFrameworkIosSimulatorArm64 \
            :engine-ios:linkDebugFrameworkIosArm64 \
            :ui:compileKotlinIosSimulatorArm64 2>&1 | tee ci-results/engine-build.log
      - name: Build Swift harness
        run: |
          xcodegen generate --spec engine-ios/harness/project.yml
          xcodebuild -project engine-ios/harness/PathCEngineHarness.xcodeproj \
            -scheme PathCEngineHarness -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath engine-ios/harness/build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci-results/harness-build.log
      - name: Run network, restart cache and fresh network regressions
        run: python3 scripts/path-c/ci_harness.py --output ci-results ${{ inputs.execution != 'local' && '--runtime-version 27.0' || '' }}
      - name: Run native Swift product regressions
        run: python3 scripts/path-c/native_product_ci.py --output ci-results/native-product ${{ inputs.execution != 'local' && '--runtime-version 27.0' || '' }}
      - name: Stop hosted resource sampler
        if: always() && inputs.execution != 'local'
        run: |
          if [[ -f "$RUNNER_TEMP/c1-resource-sampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/c1-resource-sampler.pid")" || true
          fi
      - name: Measure bounded cache layers and evidence
        if: always() && inputs.execution != 'local'
        id: cloud-size
        run: |
          mkdir -p ci-results "$GRADLE_USER_HOME/caches/modules-2" \
            "$GRADLE_USER_HOME/caches/build-cache-1" "$GRADLE_USER_HOME/wrapper" "$KONAN_DATA_DIR"
          df -h . | tee ci-results/disk-final.txt
          du -sk ci-results "$GRADLE_USER_HOME" "$KONAN_DATA_DIR" | tee ci-results/sizes-kib.txt
          gradle_kib=$(du -sk "$GRADLE_USER_HOME/caches/modules-2" \
            "$GRADLE_USER_HOME/caches/build-cache-1" "$GRADLE_USER_HOME/wrapper" | awk '{s += $1} END {print s}')
          native_kib=$(du -sk "$KONAN_DATA_DIR" | awk '{print $1}')
          printf 'gradle_kib=%s\nnative_kib=%s\n' "$gradle_kib" "$native_kib" | tee ci-results/cache-sizes.txt
          # Each layer <2 GiB, combined <3.5 GiB uncompressed; repo limit stays 10 GiB.
          # Exclude Gradle version-specific transforms and generated jars.
          if (( gradle_kib < 2097152 && native_kib < 2097152 && gradle_kib + native_kib < 3670016 )); then
            echo 'save=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Cache layers exceed the bounded save policy; no new cache saved.'
          fi
      - name: Save bounded Gradle cache
        if: success() && inputs.execution != 'local' && steps.gradle-cache.outputs.cache-hit != 'true' && steps.cloud-size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches/modules-2
            ${{ env.GRADLE_USER_HOME }}/caches/build-cache-1
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ steps.cache-keys.outputs.gradle }}
      - name: Save bounded Kotlin Native cache
        if: success() && inputs.execution != 'local' && steps.native-cache.outputs.cache-hit != 'true' && steps.cloud-size.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KONAN_DATA_DIR }}
          key: ${{ steps.cache-keys.outputs.native }}
      - name: Print hosted evidence to Actions logs
        if: always() && inputs.execution != 'local'
        run: python3 scripts/path-c/cloud_evidence.py
      - name: Upload validation evidence
        if: always() && inputs.execution == 'local'
        uses: actions/upload-artifact@v6
        with:
          name: c1-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/
            !ci-results/native-product/DerivedData/
          retention-days: 7
