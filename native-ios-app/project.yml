name: NativeReader
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Native Reader C2
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to local reader validation fixtures.
    READER_ENGINE_PLATFORM: iosSimulatorArm64
    READER_ENGINE_PLATFORM[sdk=iphoneos*]: iosArm64
targets:
  NativeReader:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.pathc.nativereader
        FRAMEWORK_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../engine-ios/build/bin/$(READER_ENGINE_PLATFORM)/debugFramework']
        OTHER_LDFLAGS: ['$(inherited)', '-framework', ReaderEngine]
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/Frameworks']
    postBuildScripts:
      - name: Embed ReaderEngine
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$destination"
          ditto "$SRCROOT/../engine-ios/build/bin/$READER_ENGINE_PLATFORM/debugFramework/ReaderEngine.framework" "$destination/ReaderEngine.framework"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = YES ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$destination/ReaderEngine.framework"
          fi
        basedOnDependencyAnalysis: false
  NativeReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NativeReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.pathc.nativereader.tests
        FRAMEWORK_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../engine-ios/build/bin/$(READER_ENGINE_PLATFORM)/debugFramework']
